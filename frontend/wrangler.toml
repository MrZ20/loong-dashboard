name = "loong-dashboard-local"
main = "dist/server/index.js"
compatibility_date = "2025-07-30"

[assets]
directory = "./dist/client"
binding = "ASSETS"
not_found_handling = "none"

[[d1_databases]]
binding = "DB"
database_name = "loong-dashboard-local"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "drizzle"

[vars]
ALLOW_DEV_AUTH = "true"
LOCAL_ADMIN_PASSWORD = "loongboard-local-development-only"
SESSION_SECRET = "loongboard-local-development-session-secret"
CREDENTIALS_ENCRYPTION_KEY = "loongboard-local-development-credentials-key"
SEED_DEMO_DATA = "false"
AI_API_MODE = "responses"
AI_MODEL = "gpt-5-mini"
